<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>explorer-app</title>
  </head>
  <body>
    <header class="bg-primary text-black">
      <div class="mx-auto flex flex-wrap max-w-7xl items-center justify-between p-4 py-5 sm:px lg:px-8">
        <a href="#" class="text-2xl font-bold">Where in the world?</a>

          <!-- Botón menú hamburguesa -->
      <button
        id="menu-button"
        type="button"
        class="rounded-small p-2 text-2xl md:hidden"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
          <img
            id="menu-icon"
            src="./src/assets/icons/menu.svg"
            alt=""
            class="h-6 w-6"
          />
      </button>

        <nav id="mobile-menu" aria-label="Navegación principal" class="hidden w-full md:block md:w-auto">
          <ul class="flex flex-col items-start gap-6 text-sm md:flex-row md:items-center md:gap-5">
            <li><a href="#inicio" class="border-b-2 border-accent" aria-current="page">Inicio</a></li>
            <li><a href="#paises" class="pb-1 hover:border-b-2 hover:border-accent">Explorar países</a></li>
            <li><a href="#acerca-de" class="pb-1 hover:border-b-2 hover:border-accent">Acerca de</a></li>
          </ul>
        </nav>
      </div>
    </header>
    

    <!-- Contenido principal -->
    <main id="inicio" class="mx-auto max-w-7xl px-4 py-8 lg:px-8">

      <!-- Título -->
      <section>
        <h1 class="font-primary text-display-large font-bold">
          Explora Países del mundo
        </h1>

        <p class="mt-2 text-body">
          Busca un país o filtra por región para consultar su información
        </p>
      </section>


      <!-- Buscador y filtro -->
      <section class="mt-8">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:gap-8">

         

        <div class="relative w-full md:flex-1">

          <img
            src="./src/assets/icons/lupa.svg"
            alt="Buscar"
            class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2"
          />

          <input
            id="country-search"
            name="country-search"
            type="search"
            placeholder="Escribe el nombre del país..."
            autocomplete="off"
            class="h-12 w-full rounded-full border border-Color-Neutral-600 bg-Surface pl-12 pr-4 text-base transition-colors duration-200 hover:border-primary focus-visible:ring-2 focus-visible:ring-accent"
          />

        </div>

          <div class="relative w-full md:w-64">

          <select
              id="region-filter"
              name="region-filter"
              class="h-12 w-full appearance-none rounded-full border border-Color-Neutral-600 bg-Surface px-4 pr-10"
            >
              <option value="">Filtrar por región</option>
              <option value="Africa">África</option>
              <option value="Americas">América</option>
              <option value="Asia">Asia</option>
              <option value="Europe">Europa</option>
              <option value="Oceania">Oceanía</option>
          </select>
          <img
            src="./src/assets/icons/filter.svg"
            alt="Abrir filtro"
            class="absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2"
          />

</div>

        </div>
      </section>


      <!-- Países -->
      <section id="paises" class="mt-12">

        <h2 class="font-primary text-heading-section font-semibold">
          Países destacados
        </h2>

        <section id="countries-container"
          class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-8 xl:grid-cols-4"
          aria-label="Listado de países"
        >
        </section>>


      </section>

    </main>


    <!-- Footer -->
    <footer
      id="acerca-de"
      class="bg-primary text-black">

      <div
        class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-5 sm:flex-row sm:items-center sm:justify-between lg:px-8">

        <div>
          <p class="font-primary font-bold">
            Explorer App
          </p>

          <p class="text-caption-regular">
            © 2026 Todos los derechos reservados
          </p>
        </div>

        <nav aria-label="Navegación del pie de página">
          <ul class="flex gap-5 text-caption-regular">
            <li>
              <a href="#inicio">Inicio</a>
            </li>

            <li>
              <a href="#paises">Explorar países</a>
            </li>

            <li>
              <a href="#acerca-de">Acerca de</a>
            </li>
          </ul>
        </nav>

      </div>
    </footer>
    
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
